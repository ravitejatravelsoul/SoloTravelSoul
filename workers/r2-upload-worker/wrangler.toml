name            = "solotravelsoul-r2-upload"
main            = "src/index.ts"
compatibility_date = "2025-06-01"

# ── R2 bucket binding ────────────────────────────────────────────────────────
# No access keys needed — the binding authenticates automatically.
[[r2_buckets]]
binding     = "R2_BUCKET"
bucket_name = "solotravelsoul-images"

# ── Non-secret vars ──────────────────────────────────────────────────────────
[vars]
FIREBASE_PROJECT_ID = "solotravelsoul-57a9e"
# Firebase Storage bucket cleaned up by POST /account/delete.
FIREBASE_STORAGE_BUCKET = "solotravelsoul-57a9e.firebasestorage.app"
# Account deletion also needs a service account with Firestore, Storage and
# Firebase Auth admin access, stored only as a Worker secret:
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
# Without it, /account/delete returns 503 and nothing is deleted.
# PUBLIC_R2_BASE_URL is set as a secret so it can differ per environment:
#   wrangler secret put PUBLIC_R2_BASE_URL
#   → paste your r2.dev URL: https://pub-<hash>.r2.dev

# Hourly sweep: deletes media of accounts deleted in the last 24 h that was
# uploaded by requests already in flight when deletion started.
[triggers]
crons = ["17 * * * *"]

# ── Staging: wrangler deploy --env staging ──────────────────────────────────
# Free-only staging: Workers Free + KV + D1, Firebase Spark. No R2 bucket and
# no Firebase Storage bucket exist for staging (never provisioned), so the
# staging Worker runs in no-legacy mode (LEGACY_MEDIA_MODE = "none"): deletion
# accepts the unbound R2 store and proves Storage empty only by an
# authenticated lookup showing the bucket does not exist. The Worker refuses
# this mode for the production project. Nothing here may name a production
# resource — `npm run check:staging` enforces this and must pass before any
# staging deploy. Secrets are per environment:
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON --env staging   (staging service account only)
#   wrangler secret put ADMIN_DELETION_TOKEN --env staging
[env.staging]
name = "solotravelsoul-r2-upload-staging"
# Canonical staging API/media host. The public Worker is a thin front
# (src/edge.ts): it forwards API routes unread to a fixed set of SQLite-backed
# Durable Objects, which authenticate and run the handlers (Workers Free: the
# front stays far below 10 ms CPU; objects have 30 s per request). Cron reaches
# one fixed maintenance object by RPC. Rollback without changing migrations:
#   npx wrangler deploy --env staging --var API_HOST_MODE:worker
# (handlers run in this Worker again; deploy without --var to return).
main = "src/edge.ts"
# Reachable on workers.dev only; no per-version preview URLs.
workers_dev = true
preview_urls = false

[[env.staging.durable_objects.bindings]]
name = "API"
class_name = "ApiShard"

# Workers Free supports only SQLite-backed Durable Objects.
[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ApiShard"]

# Workers Logs (free tier): structured events such as service_unavailable,
# maintenance_unavailable, account_deletion_stalled and deletion_sweep_failed.
[env.staging.observability]
enabled = true

# Media on Workers Free: bytes in KV, index in D1 (see migrations/).
#   wrangler kv namespace create MEDIA_KV --env staging
#   wrangler d1 create solotravelsoul-media-staging
#   wrangler d1 migrations apply solotravelsoul-media-staging --env staging --remote
[[env.staging.kv_namespaces]]
binding = "MEDIA_KV"
id      = "06c0c9d13501409cb5a115e6f71da4fd"

[[env.staging.d1_databases]]
binding        = "MEDIA_DB"
database_name  = "solotravelsoul-media-staging"
database_id    = "59c506b6-8e0d-45c8-906c-98fd55572e20"
migrations_dir = "migrations"

[env.staging.vars]
FIREBASE_PROJECT_ID = "solotravelsoul-staging"
FIREBASE_STORAGE_BUCKET = "solotravelsoul-staging.firebasestorage.app"
# Canonical origin for media URLs: this Worker's own origin (stored URLs stay valid).
MEDIA_PUBLIC_ORIGIN = "https://solotravelsoul-r2-upload-staging.ravitejatravelsoul.workers.dev"
# Staging never had legacy media (see above). Refused by the Worker for production.
LEGACY_MEDIA_MODE = "none"
# Logs per-invocation subrequest and D1 query counts (no IDs or tokens) for measurement.
LOG_BUDGET = "1"
API_SHARDS = "8"
# Inside the objects the 50-subrequest cap still applies; allowances are sized
# to it (in API_HOST_MODE "worker" these still bound each invocation's work).
SLICE_WORK_UNITS = "40"
CRON_WORK_UNITS = "40"
# The maintenance object runs every phase on each cron run.
CRON_ALL_PHASES = "1"

# The only staging maintenance schedule (every 5 minutes).
[env.staging.triggers]
crons = ["*/5 * * * *"]
