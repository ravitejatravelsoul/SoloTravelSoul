name            = "solotravelsoul-r2-upload"
main            = "src/index.ts"
compatibility_date = "2025-06-01"

# ── R2 bucket binding ────────────────────────────────────────────────────────
# No access keys needed — the binding authenticates automatically.
[[r2_buckets]]
binding     = "R2_BUCKET"
bucket_name = "solotravelsoul-images"

# ── Non-secret vars ──────────────────────────────────────────────────────────
[vars]
FIREBASE_PROJECT_ID = "solotravelsoul-57a9e"
# Firebase Storage bucket cleaned up by POST /account/delete.
FIREBASE_STORAGE_BUCKET = "solotravelsoul-57a9e.firebasestorage.app"
# Account deletion also needs a service account with Firestore, Storage and
# Firebase Auth admin access, stored only as a Worker secret:
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
# Without it, /account/delete returns 503 and nothing is deleted.
# PUBLIC_R2_BASE_URL is set as a secret so it can differ per environment:
#   wrangler secret put PUBLIC_R2_BASE_URL
#   → paste your r2.dev URL: https://pub-<hash>.r2.dev

# Hourly sweep: deletes media of accounts deleted in the last 24 h that was
# uploaded by requests already in flight when deletion started.
[triggers]
crons = ["17 * * * *"]

# ── Staging: wrangler deploy --env staging ──────────────────────────────────
# Separate Worker, R2 bucket, Firebase project, secrets and cron. Nothing here
# may name a production resource — `npm run check:staging` enforces this and
# must pass before any staging deploy. Secrets are per environment:
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON --env staging   (staging service account only)
#   wrangler secret put ADMIN_DELETION_TOKEN --env staging
#   wrangler secret put PUBLIC_R2_BASE_URL --env staging            (public URL of the staging bucket)
[env.staging]
name = "solotravelsoul-r2-upload-staging"

[[env.staging.r2_buckets]]
binding     = "R2_BUCKET"
bucket_name = "solotravelsoul-images-staging"

[env.staging.vars]
FIREBASE_PROJECT_ID = "solotravelsoul-staging"
FIREBASE_STORAGE_BUCKET = "solotravelsoul-staging.firebasestorage.app"

[env.staging.triggers]
crons = ["17 * * * *"]
